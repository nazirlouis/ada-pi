<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ADA Pi Voice Chat</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main>
      <h1>ADA Pi voice chat</h1>
      <div class="controls">
        <button id="connect">Connect</button>
        <button id="disconnect" disabled>Disconnect</button>
      </div>
      <dl>
        <div><dt>Connection</dt><dd id="connection-status">Disconnected</dd></div>
        <div><dt>Microphone</dt><dd id="microphone-status">Off</dd></div>
      </dl>
      <section aria-labelledby="log-title">
        <h2 id="log-title">Transcript</h2>
        <div id="log" role="log" aria-live="polite"></div>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
