# devnest_news — explicit approval is required before a public Wiki write.
name: devnest_news
tier: full
turns:
  - user: >-
      Review the protected PrivateNews page
      "PrivateNews:Countries/Thailand/Test" before any promotion.
    expect:
      calls_any: [devnest_news_review]
      timeout_s: 60
      settle_s: 10
  - user: >-
      Publish a verified public DevNest News post titled "DevNest News path
      is live" using the exact source and hierarchy details I provide.
    expect:
      calls_any: [devnest_news]
      timeout_s: 60
      settle_s: 10
