# SSOT: Ada tool surface — the machine-readable contract that
# scripts/tool-lint.py enforces and the tool-consolidation program
# (docs/assessments/tool-consolidation-spec-2026-10-04.md) executes
# against.
#
# "Surface" = every tool name offered to the model:
#   builtin  — function_declarations in backend/realtime_provider.py
#              (+ CHABA_DECLARATIONS, VMS/TRAFFIC declarations)
#   drop-in  — enabled entries in backend/tools.d/manifest.yml
#
# Card: tools-ci-audit. Census: tool-surface-census (103 builtin, 2026-10-04).
# The three numbers below form a ratchet:
#   count_cap     — hard fail when declared surface exceeds this.
#                   Bump ONLY by editing this file in the same commit that
#                   adds the tool — growth is deliberate, never silent.
#   target_count  — consolidation goal (~38 canonical tools). Informational;
#                   merges lower the real count toward it.
#   coverage_debt — tools with no scenario reference today. New tools may
#                   NOT join this list (lint fails) — write a scenario for
#                   the tool or move an existing entry out when it gains one.

count_cap: 112          # 103 builtin + 9 tools.d (+doc_read, card line-file-doc-ingest 2026-10-13)
target_count: 38        # spec: docs/assessments/tool-consolidation-spec-2026-10-04.md
# Description-size contract (card ada-tools-desc-slim, 2026-10-05): the
# shipped schema description is a <=2-line routing blurb — operational
# guidance lives in backend/tool_guide.yml and reaches the model only on
# a failed/denied call (the "usage" key). Lint fails when a declaration
# description exceeds these caps; bump them deliberately in the same
# commit that needs the room, never silently.
desc_max_lines: 4       # AST content lines of the description value
desc_max_chars: 300     # ~2 short lines of prose
spec: docs/assessments/tool-consolidation-spec-2026-10-04.md
alias_table: backend/tool_runner/common.py::_ALIASES
scenario_dir: tests/scenarios-live

# Lazy tool schemas (card ada-lazy-tool-schemas, 2026-10-13; arg-name
# skeleton follow-up ada-lazy-schemas-arg-names, 2026-10-14): cold tools
# ship {name, <=300-char blurb, arg-name skeleton} on the wire —
# {"type":"object","properties":{"slug":{},...},"required":[...]} keeps
# the property KEYS + required list so the model can shape its call,
# stripped of per-property type/description/enum and nested bulk. (V1
# shipped fully-empty properties and Gemini Live called cold tools with
# {} verbatim.) The real schema stays server-side where ToolRunner
# validates call args and answers a miss with the tool_guide.yml usage
# hint (self-repair). full_schema_tools is the hot set that keeps complete
# schemas because a wrong-shape guess there costs more than the schema
# saves; it MUST equal backend/realtime_provider.py::FULL_SCHEMA_TOOLS
# (lint fails on drift — change both in the same commit).
lazy_schemas:
  env_disable: ADA_LAZY_SCHEMAS        # =0 ships full schemas again
  env_extend: ADA_FULL_SCHEMA_TOOLS    # csv of extra hot tools, no redeploy
  full_schema_tools:
    - set_facial_expression            # 17k calls/7d — hottest by far; capped by
                                       # ADA_EXPRESSION_{TURN,MINUTE}_BUDGET (OPS-0509)
    - ada_memory_search
    - cms_read
    - control_entity
    - calendar_read
    - cast_to_screen
    - cctv_wall
    - docs
    - kanban
    - chat_send

# Merge families — one per tools-merge-* kanban card. `absorbed` lists the
# tool names the spec retires into `canonical` via an action= param.
# While an absorbed name is still declared the merge is pending; once it
# leaves the surface it MUST exist in tool_runner._ALIASES mapping to the
# family's canonical tool (lint enforces). `scenario` is the family's
# regression scenario — tools-merge-gate.py refuses to let the card sit
# in done until that scenario file exists AND its latest
# ada-ha-scenario-reports entry is pass|flaky.
families:
  camera:
    merge_card: tools-merge-camera
    canonical: ada_camera_snapshot  # cctv_snapshot/traffic_camera -> source= param
    scenario: tool_merge_camera
    absorbed:
      - cctv_snapshot             # -> ada_camera_snapshot {source: vms, target: tv}
      - traffic_camera            # -> ada_camera_snapshot {source: traffic}
      # capture_frame moved to the vcast_snapshot family — the display
      # merge card (tools-merge-display, 2026-10-05) ran and made
      # vcast_snapshot its canonical seat there.
    # cctv_wall deliberately NOT absorbed: a wall is a live grid, not a
    # single frame (card spec 2026-10-05).
  # cms group 7 -> 3 (tools-merge-cms, landed 2026-10-05): the card split
  # the original single-canonical design into two action= tools —
  # cms_publish_page stays declared unchanged (the big writer), the three
  # readers consolidate into cms_read, and the three writers/registry-ops
  # into cms_edit.
  cms_read:
    merge_card: tools-merge-cms
    canonical: cms_read            # list/search/get/verify -> action=, page slug in key=, term in query=
    scenario: tool_merge_cms
    absorbed:
      - cms_list_pages
      - cms_get_page
      - cms_verify_page
  cms_edit:
    merge_card: tools-merge-cms
    canonical: cms_edit            # note/delete/automate -> action= (+ op= for automate)
    scenario: tool_merge_cms
    absorbed:
      - cms_note_update
      - cms_delete_page
      - cms_automation
  # calendar+plan group 9 -> 3 (tools-merge-calendar-plan, landed
  # 2026-10-05): the card split into three canonical targets —
  # calendar_read (action=events|calendars|freebusy), calendar_write
  # (action=create|delete|shift — the CALENDAR_WRITE_TOOLS seat), and
  # plan_day (period=today|tomorrow|week; the day view folds the
  # absorbed ada_daily_summary digest in under 'digest', period='week'
  # is ada_weekly_comparison). The tasks_* tools stay declared.
  calendar_read:
    merge_card: tools-merge-calendar-plan
    canonical: calendar_read       # events/calendars/freebusy -> action=
    scenario: tool_merge_calendar_plan
    absorbed:
      - calendar_list_events
      - calendar_list_calendars
      - calendar_freebusy
  calendar_write:
    merge_card: tools-merge-calendar-plan
    canonical: calendar_write      # create/delete/shift -> action=
    scenario: tool_merge_calendar_plan
    absorbed:
      - calendar_create_event
      - calendar_delete_event
      - calendar_shift_overdue
  plan_day:
    merge_card: tools-merge-calendar-plan
    canonical: plan_day            # daily/weekly digests -> period=
    scenario: tool_merge_calendar_plan
    absorbed:
      - ada_daily_summary          # -> period='digest' (alias-internal)
      - ada_weekly_comparison      # -> period='week', end->day via shim
  # devin group 8 -> 2 (tools-merge-devin-mcp, landed 2026-10-05): the
  # card split the original single-canonical design into two action=
  # tools — devin (action=dispatch|followup|answer, the
  # DEVIN_CONFIRMED_TOOLS seat; every action is a session write) and
  # devin_read (action=status|jobs|pending|report|review — 'report'
  # keeps its internal publish confirmation; 'review' is the absorbed
  # ada_devteam_review tools.d drop-in, still owner-gated).
  # gev group 2 -> 1 (tools-merge-gev, landed 2026-10-05): gev_command
  # stays the canonical — its tour= param absorbed gev_tour (same arg
  # name, pass-through; no _ALIAS_ARG_DEFAULTS or _alias_call_args shim).
  # The CONTROL_TOOLS seat is unchanged: the gate keys off the resolved
  # name, so aliased tour lookups count against the control rate limit.
  gev:
    merge_card: tools-merge-gev
    canonical: gev_command         # command args OR tour=<id|alias>
    scenario: tool_merge_gev
    absorbed:
      - gev_tour                   # -> gev_command {tour: <id>}
  devin:
    merge_card: tools-merge-devin-mcp
    canonical: devin               # dispatch/followup/answer -> action=
    scenario: tool_merge_devin
    absorbed:
      - devin_dispatch
      - devin_followup
      - devin_answer
  devin_read:
    merge_card: tools-merge-devin-mcp
    canonical: devin_read          # status/jobs/pending/report/review -> action=
    scenario: tool_merge_devin
    absorbed:
      - devin_status
      - devin_jobs
      - devin_pending
      - devin_job_report
      - ada_devteam_review         # tools.d drop-in -> action='review' (owner_only)
  display:
  # display group 8 -> 2 (tools-merge-display, landed 2026-10-05): the
  # card spec split the family into two canonical seats — cast_to_screen
  # keeps its name and absorbs the vcast_* narrator/readers into action=
  # (say|list|status|shortcut, plus content-routed 'cast'), while
  # vcast_snapshot stays declared as its own tool (the verify-after-act
  # loop needs a separate name) and absorbs the GEV remote command
  # capture_frame. vcast_gesture survives unchanged — a distinct
  # subsystem, not a cast seat. vcast_status/vcast_shortcut were
  # census-only journal names (2 and 1 calls in 7d) with no committed
  # implementation; they alias into the matching action= seats so a
  # stale call still lands somewhere sane.
  cast_to_screen:
    merge_card: tools-merge-display
    canonical: cast_to_screen      # say/list/status/shortcut/cast + nav/play/... -> action=
    scenario: tool_merge_display
    absorbed:
      - vcast_say                 # -> action='say'
      - vcast_list                # -> action='list'
      - vcast_status              # census-only name -> action='status'
      - vcast_shortcut            # census-only name -> action='shortcut'
  vcast_snapshot:
    merge_card: tools-merge-display
    canonical: vcast_snapshot      # stays separate — verification loop seat
    scenario: tool_merge_display
    absorbed:
      - capture_frame             # GEV remote command — vcast_snapshot fires it internally
  # ha group 21 -> 6 (tools-merge-ha, landed 2026-10-05): the card split
  # the original single-ada_ha design into five canonical tools +
  # tv_action kept separate (the cmd/text/selector param surface doesn't
  # fold into action=). home_search takes kind=device|sensor|event,
  # home_history takes kind=logbook|events|timeline|series|snapshots,
  # control_entity dispatches on the entity domain (on=/action=/source=),
  # ha_confidence is read-without-args / set-with-status, and
  # get_home_state keeps its name with entity_id=/domain= params
  # (domain='memory' is the absorbed ada_ha_get_state seat).
  ha_search:
    merge_card: tools-merge-ha
    canonical: home_search         # device/sensor/event finders -> kind=
    scenario: tool_merge_ha
    absorbed:
      - search_home_devices        # -> kind='device'
      - list_home_devices          # -> kind='device', blank query
      - search_devices             # -> kind='device'
      - search_sensors             # -> kind='sensor'
      - list_sensors               # -> kind='sensor', blank query
      - ada_ha_search_devices      # -> kind='device'
      - ada_ha_search_sensors      # -> kind='sensor'
      - ada_ha_search_events       # -> kind='event'
  ha_state:
    merge_card: tools-merge-ha
    canonical: get_home_state      # entity_id=/domain= params; domain='memory' seat
    scenario: tool_merge_ha
    absorbed:
      - ada_ha_get_state           # -> domain='memory'
  ha_history:
    merge_card: tools-merge-ha
    canonical: home_history        # history/event reads -> kind=
    scenario: tool_merge_ha
    absorbed:
      - get_logbook                # -> kind='logbook'
      - get_sensor_history         # -> kind='series'
      - get_entity_events          # -> kind='timeline'
      - get_recent_events          # -> kind='events'
      - ada_ha_history             # -> kind='snapshots'
  ha_control:
    merge_card: tools-merge-ha
    canonical: control_entity      # domain dispatch on entity_id; on=/action=/source=
    scenario: tool_merge_ha
    absorbed:
      - control_cover              # -> entity cover.* + action=open|close|stop
      - control_media_player       # -> entity media_player.* + action/source
      - press_button               # -> action='press'
  ha_confidence:
    merge_card: tools-merge-ha
    canonical: ha_confidence       # read (no args) / set (entity_id+status/safety)
    scenario: tool_merge_ha
    absorbed:
      - ada_ha_get_device_confidence
      - ada_ha_set_device_confidence
  # docs+drive group 8 -> 2 (tools-merge-docs-drive, landed 2026-10-05):
  # the four ada_doc_* archive tools collapse into docs(action=
  # search|get|print|archive) and the four drive_* Drive tools into
  # drive(action=search|show|get|update). Args map 1:1 — only the implied
  # action= rides in _ALIAS_ARG_DEFAULTS. docs holds the DOC_TOOLS +
  # DOC_CONFIRMED_TOOLS seat (archive/print gated per-action), drive the
  # DRIVE_TOOLS + DRIVE_CONFIRMED_TOOLS seat (update gated per-action).
  docs:
    merge_card: tools-merge-docs-drive
    canonical: docs               # ada_doc_* -> action=search|get|print|archive
    scenario: tool_merge_docs_drive
    absorbed:
      - ada_doc_search
      - ada_doc_get
      - ada_doc_print
      - ada_doc_archive
  drive:
    merge_card: tools-merge-docs-drive
    canonical: drive              # drive_* -> action=search|show|get|update
    scenario: tool_merge_docs_drive
    absorbed:
      - drive_search
      - drive_show
      - drive_get
      - drive_update
  # memory group 8 -> 4 (tools-merge-memory, landed 2026-10-04): the four
  # canonical memory tools stay on-surface; each sub-family below maps its
  # absorbed names onto the right canonical via scope=/kind=. ada_forget is
  # unchanged; ada_resolve_action stays separate (workflow, not memory).
  memory_search:
    merge_card: tools-merge-memory
    canonical: ada_memory_search   # guest_recall -> scope=guest
    scenario: tool_merge_memory
    absorbed:
      - guest_recall
  memory_remember:
    merge_card: tools-merge-memory
    canonical: ada_remember        # vocab/habit/guest writes -> kind=
    scenario: tool_merge_memory
    absorbed:
      - vocab_note
      - report_habit_observation
      - guest_remember
      - guest_remember_private
  memory_recall:
    merge_card: tools-merge-memory
    canonical: ada_session_recall  # ada_ha_recall -> scope=history
    scenario: tool_merge_memory
    absorbed:
      - ada_ha_recall
  # meta/voice group 8 -> 3 (tools-merge-meta-voice, landed 2026-10-05):
  # ada_persona absorbs ada_set_voice (set/show/list -> *_voice actions via
  # the alias shim), the NEW ada_ops umbrella absorbs the five meta tools
  # (outcome keeps the memory-write gate seat; check/research stay
  # provider-dispatched background jobs), and ada_enroll_speaker absorbs
  # chaba's guest_register (who='guest').
  meta_voice_persona:
    merge_card: tools-merge-meta-voice
    canonical: ada_persona         # ada_set_voice -> action=set|show|list_voice(s)
    scenario: tool_merge_meta_voice
    absorbed:
      - ada_set_voice            # -> set_voice/show_voice/list_voices via shim
  meta_voice_ops:
    merge_card: tools-merge-meta-voice
    canonical: ada_ops             # meta/ops -> action=outcome|usage|health|check|research
    scenario: tool_merge_meta_voice
    absorbed:
      - ada_outcome              # -> action='outcome' (keeps the memory-write seat)
      - ada_usage_summary        # -> action='usage'
      - ada_mddb_health          # -> action='health' (tools.d drop-in retired)
      - ada_decision_check       # -> action='check' (provider-dispatched)
      - ada_deep_research        # -> action='research' (provider-dispatched)
      - report_refresh           # -> action='report' (chaba report-graph live refresh, P3)
  meta_voice_enroll:
    merge_card: tools-merge-meta-voice
    canonical: ada_enroll_speaker  # guest_register -> who='guest'
    scenario: tool_merge_meta_voice
    absorbed:
      - guest_register
  # tasks+status group 10 -> 3 (tools-merge-tasks-status, 2026-10-05):
  # the card-counted ten are the four tasks_* + six status getters plus
  # the photos picker pair under chat_send; home_status actually absorbs
  # seven getters (battery detail included) and chat_send also takes the
  # three chaba-side doc-upload card names as forward aliases.
  tasks:
    merge_card: tools-merge-tasks-status
    canonical: tasks               # add/list/done/move -> action= (list is a free read, rest confirm-gated)
    scenario: tool_merge_tasks_status
    absorbed:
      - tasks_add
      - tasks_list
      - tasks_complete
      - tasks_move
  home_status:
    merge_card: tools-merge-tasks-status
    canonical: home_status         # status getters -> what=battery|power|inverter|pool|dashboard|habit
    scenario: tool_merge_tasks_status
    absorbed:
      - get_battery_status
      - get_battery_detail         # -> what='battery', battery_index carried through
      - get_power_summary
      - get_inverter_status
      - get_pool_status
      - get_dashboard_tab
      - get_habit_status
  chat_send:
    merge_card: tools-merge-tasks-status
    canonical: chat_send           # photos picker -> photo=pick|picked; doc card actions -> doc=show|process|card
    scenario: tool_merge_tasks_status
    absorbed:
      - photos_pick
      - photos_picked
      - sys_show_uploaded_document   # chaba-side name — never declared here; forward alias
      - process_document_upload      # chaba-side name — never declared here; forward alias
      - doc_upload_card_action       # chaba-side name — never declared here; forward alias
  # yt group 4 -> 1 (tools-merge-yt, landed 2026-10-05): all four YouTube
  # tools collapse into yt(action=cast|status|stop|transcript). None of
  # them were confirm-gated; the actuation budget keeps parity per-action
  # (cast/stop count, status/transcript don't). yt itself is on the
  # display family's absorbed list for tools-merge-display.
  yt:
    merge_card: tools-merge-yt
    canonical: yt                # yt_cast* + yt_transcript -> action=
    scenario: tool_merge_yt
    absorbed:
      - yt_cast                  # -> yt {action: cast}
      - yt_cast_status           # -> yt {action: status}
      - yt_cast_stop             # -> yt {action: stop}
      - yt_transcript            # -> yt {action: transcript}
  # ada-kanban-access (2026-10-08): ada_board_write folds into the new
  # kanban tool — the design's full board surface (list/read/comment/
  # move/ask/file + owner-gated respond) under Ada's triage authority.
  # The old action names (create/read/respond) map inside the module.
  kanban:
    merge_card: ada-kanban-access
    canonical: kanban              # list/read/comment/move/ask/file/respond -> action=
    # report-first protocol (ssot.apps.cms-reports.yml, chaba): reads go
    # through the kanban-brief board-index block; expected_updated= is the
    # stale-write guard on comment/move/respond (refuse -> re-read -> retry).

    scenario: kanban_review
    absorbed:
      - ada_board_write            # -> kanban, action names pass through

# Tools with no reference in any tests/scenarios-live/*.yaml tool field
# (calls/calls_any/no_calls*/needs_tools/needs_any, @family-expanded) at
# census time. Acknowledged debt — entries should leave this list as the
# tools-regression-scenarios card lands coverage. A declared tool absent
# from BOTH scenarios and this list fails lint (no silent uncovered adds).
coverage_debt:
  - voice_fx
  - percussion
  - ada_device_acl
  - ada_resolve_action
  - chat_send
  - control_cover
  - devin_followup
  - devin_job_report
  - drive_update
  - get_battery_detail
  - get_battery_status
  - get_dashboard_tab
  - get_entity_events
  - get_habit_status
  - get_inverter_status
  - get_pool_status
  - get_power_summary
  - get_sensor_history
  - gev_tour
  - guest_register
  - photos_pick
  - photos_picked
  - press_button
  - tasks_move
  - yt_cast_status
  - place_report
  - cpt_post
  - weather_station
  - ada_sweep

# Tools that legitimately never get a live scenario (pure meta/report
# surfaces). Empty at census — prefer coverage_debt over listing here.
coverage_exempt: []

# decl<->impl contract (tool-decl-impl-lint, 2026-10-05): every builtin
# declaration must land on a public async ToolRunner method — execute()
# awaits getattr(self, name) — and every public async ToolRunner method
# must resolve to the declared surface or the alias table. Two explicit
# exceptions:
#   provider_dispatched — builtin declarations realtime_provider.py
#     handles inline in its function-call chain (no ToolRunner method;
#     the call never reaches runner.execute).
#   runner_internal — public async ToolRunner methods that are dispatch
#     plumbing, not tools. New public helpers should be _underscore —
#     a listing here is a deliberate exemption, not the default.
provider_dispatched:
  - set_facial_expression     # emits ProviderEvent("expression") inline
runner_internal:
  - execute                   # the dispatch entry point itself
